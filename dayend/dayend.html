    <div class="container" id="dayendScreen">
        <h1 style="text-align: center; color: black;">DayEnd Report</h1>
        <div class="row" style="font-size: 22px;">
            <br>
            <div class="col-md-4">
                <label for="POSName">POS : </label>
                <label id="POSName"></label>
            </div>
            <div class="col-md-4">
                <label for="BillCounterName">Counter : </label>
                <label id="BillCounterName"> </label>
            </div>
            <div class="col-md-4">
                <label for="BillDate">EOD Date : </label>
                <!-- <label id="BillDate"></label> -->
                <input type="text" id="datepicker" disabled>

            </div>
        </div>

        <div class="row">
            <div class="col-md-6" id="dayendSales">
                <hr>
                <table class="table tablesaw-enhanced" id="productsList">
                    <thead>
                        <tr>
                            <th colspan="3" style="text-align: center; color: black;">Sales</th>
                        </tr>
                    </thead>
                    <tbody id="sales_list" style="color: black;"></tbody>
                </table>
                <p>&nbsp; <label id="UnpaidBills"> </label></p>
                <p>&nbsp; <label id="cancelbill"> </label></p>
                <p>&nbsp; <label id="cateringAdvance"></label></p>
                <p>&nbsp; <label id="cateringCard"></label></p>
                <p>&nbsp; <label id="cateringOnline"></label></p>
                <table class="table tablesaw-enhanced" id="productsList">
                    <thead>
                        <tr>
                            <th colspan="3" style="text-align: center; color: black;">Cash Transactions</th>
                        </tr>
                    </thead>
                    <tbody id="payment_list" style="color: black;"></tbody>
                </table>

            </div>
            <div class="col-md-6" id="dayendpayments">
                <hr>

                <table class="table tablesaw-enhanced" id="productsList">
                    <thead>
                        <tr>
                            <th colspan="2" style="text-align: center; color: black;">Payments</th>
                        </tr>
                    </thead>
                    <tbody id="balance_list" style="color: black;"></tbody>
                </table>
                <table class="table tablesaw-enhanced" id="productsList">
                    <thead>
                        <tr>
                            <th colspan="5" style="text-align: center; color: black;">DENOMINATION- CASH SALES</th>
                        </tr>
                        <tr>
                            <th style="color: black;">Rupee</th>
                            <th style="color: black;"> &nbsp;</th>
                            <th style="color: black;">Nos</th>
                            <th style="color: black;">Value As</th>
                            <th style="color: black;">Remarks</th>
                        </tr>
                    </thead>
                    <tbody id="Denomination_list" style="color: black;"></tbody>
                </table>
            </div>
            <div class="actions" style="margin-bottom:20px ;">
                <button type="button" class="btn btn-success" style="text-align: right; margin-left: 750px;"
                    onclick="$(this).print()"> Print </button>
                <button type="button" class="btn btn-success" id="CounterDayend" style="text-align: right; margin-left: 15px;"
                    onclick="$(this).counterDayEnd()">Print & DayEnd</button>
            </div>
        </div>

        <div class="footer">
            <button class="btn btn-danger" style="margin-top: -16px; float:right;"
                onclick="$(this).Cancel()">Close</button>
        </div>
    </div>
