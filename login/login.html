    <div class="main_app">
        <div class="login-bg-img">
            <div style="text-align-last:end">
                <button id="Minimize" type="button" class="btn btn-primary waves-effect waves-light">
                    <i class="glyphicon glyphicon-minus"></i>
                </button>
                <button id="quit" type="button" class="btn btn-danger waves-effect waves-light">
                    <i class="glyphicon glyphicon-remove"></i>
                </button>
            </div>
            <div id="login-bg">
                <form id="account">
                    <div class="text-center">
                        <img src="../../assets/images/logo-default.png" style="width: 185px;" alt="logo">
                        <div class="form-group">
                            <input type="text" placeholder="Username" name="username" id="loginpg_email"
                                class="form-control">
                        </div>
                        <div class="form-group">



                            <input type="password" placeholder="Password" id="loginpg_password" name="password"
                                class="form-control"><br>
                            <p style="color: black;"> <input type="checkbox" onclick="$(this).myFunction()"> &nbsp; Show
                                Password</p>

                        </div>

                        <div class="form-group">
                            <button class="btn  btn-success btn-block" type="submit"
                                onclick="$(this).signInClick(event)">
                                Login
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
