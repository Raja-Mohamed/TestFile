<html lang="en">

<head>
     <link href="../../assets/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
     <link href="../../assets/css/core.css" rel="stylesheet" type="text/css" />
     <link href="../../assets/css/pages.css" rel="stylesheet" type="text/css" />
     <link href="../../assets/css/responsive.css" rel="stylesheet" type="text/css" />
     <link href="../../assets/css/datepicker.css" rel="stylesheet" type="text/css" />
     <link href="../../assets/css/autocomplete.css" rel="stylesheet" type="text/css" />
     <link href="../../assets/css/icons.css" rel="stylesheet" type="text/css" />

<body>
     <div class="container">
          <div class="row">
               <div class="col-md-6">
                    <h1 style="text-align: end; color: black; font-size: 25px;">Order Booking List</h1>
               </div>
               <div class="col-md-6" style="text-align: center;">
                    <label for="POSName">POS Name:</label>
                    <label id="POSName"></label>
                    <span>&nbsp;</span>
                    <label for="billCounterName" style="margin-left:20px;">Counter Name:</label>
                    <label id="billCounterName"></label>
               </div>

               <!-- <h1 style="text-align: center; color: black; font-size: 25px;">Order Booking List</h1> -->

          </div>

          <div class="row">

               <div class="col-md-10">

                    <span style="margin-left:10px; ">
                         <label for="BillDate">From Date: </label>
                         <!-- <label id="BillDate"></label> -->
                         <input type="text" id="fromdate">

                    </span>


                    <span style="margin-left:10px; ">
                         <label for="BillDate">To Date: </label>
                         <!-- <label id="BillDate"></label> -->
                         <input type="text" id="todate">
                    </span>

                    <span style="margin-left:10px; ">
                         <button class="btn btn-success" onclick="$(this).runSearch()">Run</button>
                    </span>

                    <span style="margin-left:10px; ">
                         <button class="btn btn-success" onclick="$(this).loadItemsToDisplay()">Refresh</button>
                    </span>
                    <span style="margin-left:10px; ">
                         <button class="btn btn-success" onclick="$(this).PrintSummaryReport()">Print Summary Report</button>
                    </span>
               </div>


               <div class="col-md-2">
                    <!-- <label for="POSName">POS Name:</label>
                         <label id="POSName"></label>
                         <label for="billCounterName" style="margin-left:20px;">Counter Name:</label>
                         <label id="billCounterName"></label> -->
                        
                         <span style="margin-left:46px; ">
                    <label for="orderbookingList" style="font-size: 17px;">Total Count:</label>
                    <label id="orderbookingList" style="font-size: 18px;"></label>
                         </span>
               </div>
          </div>

               <div class="row" style="margin-top: 10px;">
                    <div class="col-md-10">
                         <span style="margin-left:10px; ">
                              <label for="SearchOrder">Search : </label>
                              <input type="text" id="SearchOrder" style="margin-left: 20px;" onkeyup="$(this).SearchOrder()">
                         </span>

                         <span style="margin-left:10px; ">
                              <label for="DeliveryDate">Delivery Date: </label>
                              <!-- <label id="BillDate"></label> -->
                              <input type="text" id="DeliveryDate">

                         </span>

                         <span style="margin-left:10px; ">
                              <button class="btn btn-success" id="PrintReport" onclick="$(this).PrintItemReport()">Print Delivery ItemReport</button>
                         </span>

                    </div>
          <!-- <div class="row" style="margin-top: 10px;">
               <div class="col-md-12">
                    <span style="margin-left:10px; ">
                         <label for="SearchOrder">Search : </label>
                         <input type="text" id="SearchOrder" style="margin-left: 20px;" onkeyup="$(this).SearchOrder()">
                    </span>
               </div>
          </div> -->

               
                   
                        


                   
             



               <div class="row" style="margin-top: 10px;">
                    <div class="col-md-12" style="margin-left: 10px;">
                         <button class="btn btn-success" onclick="$(this).openOrderBookingPopupWindow()">Add</button>
          
     </div>

     <div class="row" style="margin-top: 10px;margin-left:10px;">
          <div class="col-md-12">
               <div>

                    <table class="table tablesaw-enhanced">
                         <thead>
                              <tr>
                                   <th>Date</th>
                                   <th>Booking No</th>
                                   <th>Delivery Date</th>
                                   <th>Booking Person</th>
                                   <th>Phone #</th>
                                   <th>Total Amount</th>
                                   <th>Paid Amount</th>
                                   <th>Balance</th>
                                   <th>Bill Type</th>
                                   <th>Actions</th>
                              </tr>
                         </thead>
                         <tbody id="order_list"></tbody>
                    </table>
               </div>
          </div>
     </div>
</body>

</html>
